              example: Invalid username or answers
        '403':
          description: The answers were right but the login is `INACTIVE`, `SUSPENDED` or `LOCKED`.
          content:
            text/plain:
              schema: {type: string}
        '423':
          description: Too many wrong answers; the reset is locked.
          content:
            text/plain:
              schema: {type: string}
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/api/staff/security-questions:
    put:
      tags: [Password reset]
      operationId: staffSetSecurityQuestions
      summary: Choose and answer three security questions
      description: |
        Requires the employee token. Pick **three different** questions from the catalog and answer each (2 to 100 characters). Replaces any earlier choice in place. Needs the **current password** so a stolen token alone can't change the questions that guard the password reset.
        Returns the chosen questions (never the answers). The answers and current password are masked in request logs.
      security:
        - CustomerId: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetSecurityQuestionsRequest'}
            example: {currentPassword: '20260009', answers: [{question: FIRST_CAR, answer: Honda Civic}, {question: FIRST_SCHOOL, answer: Oak Street}, {question: FIRST_TEACHER, answer: Mrs Patel}]}
      responses:
        '200':
          description: The chosen questions.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SecurityQuestionView'}}
        '400':
          description: Not exactly 3 answers, a duplicate question, or an answer outside 2-100 characters.
          content:
            text/plain:
              schema: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: The login is locked from wrong passwords.
          content:
            text/plain:
              schema: {type: string}
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/api/staff/customers/{customerId}/password:
    put:
      tags: [Password reset]
      operationId: setCustomerPassword
      summary: Set a customer's password
      description: |
        Requires the `MANAGE_CUSTOMER_LOGINS (managers and up)` privilege. Sets the customer's password to a new exactly-8-digit value (stored as a BCrypt hash, masked in request logs):
        for a forgotten password when no security questions were set, or as an administrator reset. The login failure and password-reset
        counters are cleared, the login status is left as it is, and **every token the customer holds stops working**. Returns `204`.
      security:
        - CustomerId: []
          BearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema: {type: integer, format: int64}
          example: 9
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminSetPasswordRequest'}
            example: {newPassword: '24681357'}
      responses:
        '204':
          description: Password set.
        '400':
          description: Missing `newPassword` (JSON validation) or not exactly 8 digits (plain text).
          content:
            text/plain:
              schema: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmployeeForbidden'
        '404':
          description: No such customer or no login. Plain text.
          content:
            text/plain:
              schema: {type: string}
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/api/staff/employees/{employeeNumber}/password:
    put:
      tags: [Password reset]
      operationId: setEmployeePassword
      summary: Set an employee's password
      description: |
        Requires the `MANAGE_EMPLOYEES (area managers)` privilege. Sets the employee's password to a new exactly-8-digit value (stored as a BCrypt hash, masked in request logs):
        for a forgotten password when no security questions were set, or as an administrator reset. The login failure and password-reset
        counters are cleared, the login status is left as it is, and **every token the employee holds stops working**. Returns `204`.
      security:
        - CustomerId: []
          BearerAuth: []
      parameters:
        - name: employeeNumber
          in: path
          required: true
          schema: {type: string}
          example: EMP-000020
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminSetPasswordRequest'}
            example: {newPassword: '24681357'}
      responses:
        '204':
          description: Password set.
        '400':
          description: Missing `newPassword` (JSON validation) or not exactly 8 digits (plain text).
          content:
            text/plain:
              schema: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmployeeForbidden'
        '404':
          description: No such employee or no login. Plain text.
          content:
            text/plain:
              schema: {type: string}
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /bff/v1/portal/home:
    get:
      tags: [Portal (BFF)]
      operationId: portalHome
      security:
        - CustomerId: []
          CustomerBearerAuth: []
      summary: Portal home screen bundle
      description: |
        One call for the portal home screen: the newest `ACTIVE` and `SUSPENDED` accounts merged, newest
        first (closed are omitted; at most `banking.portal.home-account-limit`, default 5; no balances; each row has
        `suspended`/`suspendedUntil`) with the active/suspended totals plus branches/ATMs
        sorted by name (at most `banking.portal.nearby-location-limit`, default 5).
        `state` is optional; without it locations are not filtered.
      parameters:
        - name: state
          in: query
          required: false
          description: Two-letter state used to filter nearby locations (case-insensitive).
          schema: {type: string}
          example: TX
      responses:
        '200':
          description: The home bundle.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortalHomeResponse'}
        '401':
          $ref: '#/components/responses/CustomerUnauthorized'
        '403':
          $ref: '#/components/responses/CustomerForbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /bff/v1/portal/accounts/{accountNumber}/overview:
    get:
      tags: [Portal (BFF)]
      operationId: portalAccountOverview
      security:
        - CustomerId: []
          CustomerBearerAuth: []
      summary: Account detail with balance and recent activity
      description: |
        Balance plus the account's transactions from the last `days` days, newest first, capped
        at `banking.portal.activity-limit` (default 20). Read-only: unlike the statement
        endpoint it sends no email/SMS.
      parameters:
        - $ref: '#/components/parameters/AccountNumberPath'
        - name: days
          in: query
          required: false
          description: Activity window in days, 1 to `banking.portal.max-activity-days` (default 90). Defaults to 30.
          schema: {type: integer, minimum: 1, maximum: 90, default: 30}
      responses:
        '200':
          description: The account overview.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountOverviewResponse'}
        '400':
          $ref: '#/components/responses/BadRequestText'
        '401':
          $ref: '#/components/responses/CustomerUnauthorized'
        '403':
          $ref: '#/components/responses/CustomerForbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /bff/v1/portal/accounts/withdraw:
    post:
      tags: [Portal (BFF)]
      operationId: portalWithdraw
      security:
        - CustomerId: []
          CustomerBearerAuth: []
      summary: Withdraw and get the refreshed account overview
      description: |
        Same body, rules and side effects as `POST /v1/api/accounts/withdraw`, but the response is the
        account overview (balance, suspension state, recent activity) so the portal can redraw in one call.
        A `CLOSED` or `SUSPENDED` account is rejected with a plain-text `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WithdrawalRequest'}
      responses:
        '200':
          description: Withdrawal completed; the refreshed overview.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountOverviewResponse'}
        '400':
          description: >-
            Validation failure (JSON) or a business rule failed (plain text), including
            "is suspended and cannot be used for transactions until it is reactivated".
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpringErrorResponse'}
            text/plain:
              schema: {type: string}
        '401':
          $ref: '#/components/responses/CustomerUnauthorized'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '403':
          $ref: '#/components/responses/CustomerForbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /bff/v1/portal/accounts/deposit:
    post:
      tags: [Portal (BFF)]
      operationId: portalDeposit
      security:
        - CustomerId: []
          CustomerBearerAuth: []
      summary: Deposit and get the refreshed account overview
      description: |
        Same body, rules and side effects as `POST /v1/api/accounts/deposit`, but the response is the
        account overview. A `CLOSED` or `SUSPENDED` account is rejected with a plain-text `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DepositForm'}
      responses:
        '200':
          description: Deposit completed; the refreshed overview.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountOverviewResponse'}
        '400':
          description: Validation failure (JSON) or a business rule failed (plain text).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpringErrorResponse'}
            text/plain:
              schema: {type: string}
        '401':
          $ref: '#/components/responses/CustomerUnauthorized'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '403':
          $ref: '#/components/responses/CustomerForbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /bff/v1/portal/accounts/{accountNumber}/close:
    post:
      tags: [Portal (BFF)]
      operationId: portalCloseAccount
      security:
        - CustomerId: []
          CustomerBearerAuth: []
      summary: Close an account and get the refreshed overview
      description: |
        Same rules as `POST /v1/api/accounts/{accountNumber}/close` (irreversible; a suspension is cleared);
        returns the account overview (`CLOSED`, `closedDate`).
      parameters:
        - $ref: '#/components/parameters/AccountNumberPath'
      responses:
        '200':
          description: Account closed; the refreshed overview.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountOverviewResponse'}
        '400':
          $ref: '#/components/responses/BadRequestText'
        '401':
          $ref: '#/components/responses/CustomerUnauthorized'
        '403':
          $ref: '#/components/responses/CustomerForbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /bff/v1/portal/accounts/{accountNumber}/statement:
    post:
      tags: [Portal (BFF)]
      operationId: portalStatement
      security:
        - CustomerId: []
          CustomerBearerAuth: []
      summary: Generate a statement for a date range
      description: |
        Same rules and result as `GET /v1/api/accounts/{accountNumber}/statement`, including its side effect
        (an async email/SMS notification). It is a `POST` because portal reads are side-effect free.
      parameters:
        - $ref: '#/components/parameters/AccountNumberPath'
        - name: beginDate
          in: query
          required: true
          schema: {type: string, format: date}
        - name: endDate
          in: query
          required: true
          schema: {type: string, format: date}
      responses:
        '200':
          description: The statement.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BankStatement'}
        '400':
          description: Missing/malformed date parameter (JSON), end before begin, or range too long (plain text).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpringErrorResponse'}
            text/plain:
              schema: {type: string}
        '401':
          $ref: '#/components/responses/CustomerUnauthorized'
        '403':
          $ref: '#/components/responses/CustomerForbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /bff/v1/portal/accounts/open:
    post:
      tags: [Portal (BFF)]
      operationId: portalOpenAccount
      summary: Open an account and get nearby branches
      description: |
        Same rules, validation and side effects as `POST /v1/api/accounts/newaccount`, plus
        the branches/ATMs in the customer's `state` in the same response.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountRegistrationRequest'}
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAccountResponse'}
        '400':
          description: >-
            Validation failure (JSON body), or a business rule was violated (plain-text body).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpringErrorResponse'}
            text/plain:
              schema: {type: string}
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/client/name:
    get:
      tags: [Clients]
      operationId: getClient
      summary: Get the sample client record
      description: Returns a hard-coded sample `Customer`; not tied to persisted data.
      responses:
        '200':
          description: Sample customer.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Customer'}
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/payment/process:
    post:
      tags: [Payments]
      operationId: processPayment
      summary: Process a payment through a flaky downstream (resilience demo)
      description: |
        Calls a simulated bank service that fails ~40% of the time, wrapped in a Resilience4j
        `@Retry` (3 attempts, jittered exponential backoff) around a `@CircuitBreaker`.
        Failures never surface as HTTP errors: once retries are exhausted or the breaker is
        open, the fallback returns a `200` with a "temporarily unavailable" message, so
        clients must inspect the body.
      responses:
        '200':
          description: Either the success message or the fallback message.
          content:
            text/plain:
              schema: {type: string}
              examples:
                success:
                  value: Successfully Processed
                fallback:
                  value: Payment service temporarily unavailable
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /notify:
    get:
      tags: [Notifications]
      operationId: notifyUser
      summary: Queue an async email notification
      description: >-
        Fire-and-forget: returns immediately; the email is "sent" on a background thread.
        Skipped silently if `notification.email.enabled` is false.
      parameters:
        - $ref: '#/components/parameters/NotifyName'
      responses:
        '200':
          description: Request accepted.
          content:
            text/plain:
              schema: {type: string}
              example: Email request accepted! Check console logs in 3 seconds.
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /notify-sms:
    get:
      tags: [Notifications]
      operationId: notifyUserBySms
      summary: Queue an async SMS notification
      description: >-
        Fire-and-forget. Skipped silently if `notification.sms.enabled` is false (the
        default) or the daily SMS limit (`notification.sms.daily-limit`) has been reached -
        the response is `200` either way.
      parameters:
        - $ref: '#/components/parameters/NotifyName'
      responses:
        '200':
          description: Request accepted.
          content:
            text/plain:
              schema: {type: string}
              example: SMS request accepted! Check console logs in 3 seconds.
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /report:
    get:
      tags: [Notifications]
      operationId: getReport
      summary: Fetch an async-generated report
      description: >-
        Runs report generation asynchronously (`CompletableFuture`); the response is sent
        once it completes.
      responses:
        '200':
          description: The report text.
          content:
            text/plain:
              schema: {type: string}
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    CustomerId:
      type: apiKey
      in: header
      name: X-Customer-Id
      description: |
        Customer identifier used solely for per-customer daily rate limiting - **not**
        authentication; any non-blank value is accepted. The header name is configurable
        (`banking.rate-limit.customer-header-name`) and the check can be turned off with
        `banking.rate-limit.enabled: false`.

    CustomerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The customer access token returned by `POST /v1/api/customers/login` (HS256, 30 minutes, no refresh), sent as
        `Authorization: Bearer <token>`. Required on every `/v1/api/accounts/**`, `/v1/api/customers/**` and `/bff/v1/portal/**` operation except
        the ones a user without a token must reach: the two that create a customer (`POST /v1/api/accounts/newaccount`, `POST /bff/v1/portal/accounts/open`), the login and the two password-reset calls. It proves who
        logged in; the customer's login is re-checked on every request, and the customer can only reach their own accounts.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The employee access token returned by `POST /v1/api/staff/login` (HS256, 30 minutes, no refresh), sent as
        `Authorization: Bearer <token>`. It proves who logged in; permissions and status are re-checked from the
        database on every request, so a suspended login stops working immediately.

  parameters:
    AccountNumberPath:
      name: accountNumber
      in: path
      required: true
      description: >-
        Account number: `CH-` (checking) or `SV-` (savings) followed by a zero-padded
        10-digit number.
      schema: {type: string}
      example: CH-0000088291
    LocationIdPath:
      name: id
      in: path
      required: true
      description: Bank location id.
      schema: {type: integer, format: int64}
      example: 4
    NotifyName:
      name: name
      in: query
      required: true
      description: Recipient name to notify.
      schema: {type: string}
      example: Jane Doe

  responses:
    BadRequestText:
      description: A business rule was violated. Plain-text message.
      content:
        text/plain:
          schema: {type: string}
          examples:
            dateRange:
              value: createdFrom (2026-05-01) must not be after createdTo (2026-01-01)
            months:
              value: months must be positive, got 0
            sort:
              value: 'Unsupported sort property: balance (supported: createdDate, closedDate, accountStatus, accountNumber)'
            locationSort:
              value: 'Unsupported sort property: phoneNumber (supported: name, locationType, city, state)'
    BadRequestJson:
      description: Request body/parameter failed validation. Spring Boot default JSON error body.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SpringErrorResponse'}
    AccountNotFound:
      description: No account with that number. Plain-text body.
      content:
        text/plain:
          schema: {type: string}
          example: 'Account not found: CH-9999999999'
    LocationNotFound:
      description: No bank location with that id. Plain-text body.
      content:
        text/plain:
          schema: {type: string}
          example: 'Bank location not found: 999'
    Unauthorized:
      description: >-
        No bearer token, or the token is invalid, expired or forged. Plain-text body; the response carries
        `WWW-Authenticate: Bearer`. Written by the staff authentication filter, so there is no JSON body.
      headers:
        WWW-Authenticate:
          schema: {type: string, example: Bearer}
      content:
        text/plain:
          schema: {type: string}
          examples:
            missing:
              value: "Authentication required: send 'Authorization: Bearer <token>' from POST /v1/api/staff/login"
            invalid:
              value: Invalid or expired token
    CustomerUnauthorized:
      description: >-
        No bearer token, or the token is invalid, expired or forged (also: the customer no longer has a login). Plain-text
        body; the response carries `WWW-Authenticate: Bearer`. Written by the customer authentication filter.
      headers:
        WWW-Authenticate:
          schema: {type: string, example: Bearer}
      content:
        text/plain:
          schema: {type: string}
          examples:
            missing:
              value: "Authentication required: send 'Authorization: Bearer <token>' from POST /v1/api/customers/login"
            invalid:
              value: Invalid or expired token
    CustomerForbidden:
      description: >-
        The account belongs to another customer, the token is an employee token, or the customer's login is `INACTIVE`,
        `SUSPENDED` or `LOCKED` (the login is re-checked on every request, so this applies at once even with an unexpired
        token). Plain-text body.
      content:
        text/plain:
          schema: {type: string}
          examples:
            notYours:
              value: Account SV-0000044102 does not belong to the authenticated customer
            employeeToken:
              value: This endpoint needs a customer token
            loginNotActive:
              value: 'Customer login is SUSPENDED; only an ACTIVE login can perform transactions'
    EmployeeForbidden:
      description: >-
        The acting employee is not ACTIVE, their login is not ACTIVE (or they have none), or their role lacks the
        required privilege. Plain-text body.
      content:
        text/plain:
          schema: {type: string}
          examples:
            privilege:
              value: 'Employee EMP-000010 (TELLER) is not authorized: requires SUSPEND_ACCOUNT'
            onLeave:
              value: Employee EMP-000016 is ON_LEAVE and cannot perform this action
            customerToken:
              value: This endpoint needs an employee token
            loginSuspended:
              value: 'Employee EMP-000010 login is SUSPENDED; only an ACTIVE login can perform transactions'
    TooManyRequests:
      description: >-
        The calling customer's daily quota (`banking.rate-limit.requests-per-day`) is
        exhausted. Written by the gateway filter as plain text. (A missing/blank customer-id
        header is rejected by the same filter with `400` and a plain-text message - see
        *Gateway behavior*.)
      headers:
        X-BTID:
          $ref: '#/components/headers/X-BTID'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
      content:
        text/plain:
          schema: {type: string}
          example: 'Daily request limit exceeded for customer cust-42: max 1000 requests per day'

  headers:
    X-BTID:
      description: Business transaction id (UUID) for this request; appears on every server log line for it.
      schema: {type: string, format: uuid}
    X-RateLimit-Limit:
      description: Requests per day allowed for the calling customer.
      schema: {type: integer}
    X-RateLimit-Remaining:
      description: Requests remaining today for the calling customer.
      schema: {type: integer}

  schemas:
    LoginStatus:
      type: string
      enum: [ACTIVE, INACTIVE, LOCKED, SUSPENDED]
      description: |
        State of an employee or customer login; **only `ACTIVE` may perform transactions**. `LOCKED` is set
        automatically after too many wrong passwords (it expires at `lockedUntil`) or by an administrator
        (no expiry); `INACTIVE` and `SUSPENDED` are set by an administrator until set back to `ACTIVE`.

    SecurityQuestion:
      type: string
      enum: [FIRST_CAR, FIRST_SCHOOL, FIRST_TEACHER, FIRST_PET, BIRTH_CITY, CHILDHOOD_FRIEND]
      description: The fixed catalog a user picks three from. `FIRST_CAR` "What was your first car?", `FIRST_SCHOOL` "What was the name of your first school?", `FIRST_TEACHER` "Who was your first teacher?", `FIRST_PET`, `BIRTH_CITY`, `CHILDHOOD_FRIEND`.

    SecurityQuestionView:
      type: object
      properties:
        question: {$ref: '#/components/schemas/SecurityQuestion'}
        text: {type: string, example: What was your first car?}

    SecurityAnswerRequest:
      type: object
      required: [question, answer]
      properties:
        question: {$ref: '#/components/schemas/SecurityQuestion'}
        answer: {type: string, minLength: 2, maxLength: 100, description: 'Case-insensitive with whitespace collapsed; stored only as a BCrypt hash and masked in logs.'}

    SetSecurityQuestionsRequest:
      type: object
      required: [currentPassword, answers]
      properties:
        currentPassword: {type: string, description: The caller's current password.}
        answers:
          type: array
          minItems: 3
          maxItems: 3
          description: Exactly three answers to three different questions.
          items: {$ref: '#/components/schemas/SecurityAnswerRequest'}

    PasswordResetQuestionsRequest:
      type: object
      required: [username]
      properties:
        username: {type: string, example: alice.smith}

    PasswordResetRequest:
      type: object
      required: [username, answers, newPassword]
      properties:
        username: {type: string, example: alice.smith}
        answers:
          type: array
          minItems: 3
          maxItems: 3
          items: {$ref: '#/components/schemas/SecurityAnswerRequest'}
        newPassword: {type: string, description: 'Exactly 8 digits. Masked in request logs.', example: '24681357'}

    AdminSetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: {type: string, description: 'Exactly 8 digits. Masked in request logs.', example: '24681357'}

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, example: lucas.meyer}
        password: {type: string, description: Exactly 8 digits. Masked in request logs., example: '20260010'}

    StaffLoginResponse:
      type: object
      properties:
        accessToken: {type: string, description: Signed JWT (HS256). A credential - never log it., example: eyJhbGciOiJIUzI1NiJ9...}
        tokenType: {type: string, example: Bearer}
        expiresIn: {type: integer, format: int64, description: Seconds until the token expires., example: 1800}
        employee: {$ref: '#/components/schemas/Employee'}

    CustomerLoginResponse:
      type: object
      properties:
        accessToken: {type: string, description: Signed JWT (HS256). A credential - never log it., example: eyJhbGciOiJIUzI1NiJ9...}
        tokenType: {type: string, example: Bearer}
        expiresIn: {type: integer, format: int64, example: 1800}
        customer: {$ref: '#/components/schemas/AuthenticatedCustomer'}

    AuthenticatedCustomer:
      type: object
      description: Who a successful customer login belongs to; no date of birth, phone or address.
      properties:
        customerId: {type: integer, format: int64}
        firstName: {type: string}
        lastName: {type: string}

    ChangeLoginStatusRequest:
      type: object
      required: [status]
      properties:
        status: {$ref: '#/components/schemas/LoginStatus'}
        reason: {type: string, maxLength: 200}

    LoginStatusView:
      type: object
      properties:
        username: {type: string}
        status: {$ref: '#/components/schemas/LoginStatus'}
        statusReason: {type: string, nullable: true}
        statusChangedAt: {type: string, format: date-time, nullable: true}
        lockedUntil: {type: string, format: date-time, nullable: true, description: Set only for an automatic lock.}

    EmployeeRole:
      type: string
      enum: [TELLER, MANAGER, AREA_MANAGER]
      description: |
        `TELLER`: VIEW_ACCOUNT, DEPOSIT, WITHDRAW. `MANAGER`: plus SUSPEND_ACCOUNT, UPDATE_SUSPENSION,
        REACTIVATE_ACCOUNT, CLOSE_ACCOUNT, VIEW_BRANCH_REPORTS, MANAGE_CUSTOMER_LOGINS. `AREA_MANAGER`: plus MANAGE_EMPLOYEES.

    EmployeePrivilege:
      type: string
      enum: [VIEW_ACCOUNT, DEPOSIT, WITHDRAW, SUSPEND_ACCOUNT, UPDATE_SUSPENSION, REACTIVATE_ACCOUNT, CLOSE_ACCOUNT, VIEW_BRANCH_REPORTS, MANAGE_EMPLOYEES, MANAGE_CUSTOMER_LOGINS]

    Employee:
      type: object
      properties:
        id: {type: integer, format: int64}
        employeeNumber: {type: string, example: EMP-000010}
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string}
        phoneNumber: {type: string, example: 512-555-0210}
        role: {$ref: '#/components/schemas/EmployeeRole'}
        jobTitle: {type: string}
        status: {type: string, enum: [ACTIVE, ON_LEAVE, TERMINATED]}
        hireDate: {type: string, format: date}
        bankLocationId: {type: integer, format: int64, nullable: true, description: Branch; null for area managers.}
        region: {type: string, nullable: true, description: Area covered; set for area managers.}
        supervisorId: {type: integer, format: int64, nullable: true}
        privileges:
          type: array
          description: Derived from `role`.
          items: {$ref: '#/components/schemas/EmployeePrivilege'}

    AccountType:
      type: string
      description: >-
        Only `CHECKING` and `SAVINGS` are usable - the other values exist in the enum but
        no account of those kinds can be created or transacted against.
      enum: [CHECKING, SAVINGS, INVESTMENT, RETIREMENT, CREDIT_OR_LOAN]

    AccountStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, CLOSED]
      description: |
        `SUSPENDED` accounts reject every withdraw and deposit until reactivated (or until
        `suspendedEnd` passes and the expiry job reactivates them). `CLOSED` is final.

    TransactionType:
      type: string
      enum: [DEPOSIT, WITHDRAWAL]

    Address:
      type: object
      properties:
        street: {type: string, example: '111'}
        city: {type: string, example: Leander}
        state: {type: string, example: TX}
        zip: {type: string, example: '78717'}
        country: {type: string, default: USA, example: USA}
        addressLine1: {type: string, example: Leafvillage}
        addressLine2: {type: string, nullable: true, example: Unit1}

    Customer:
      type: object
      properties:
        firstName: {type: string, example: Jane}
        lastName: {type: string, example: Doe}
        address: {$ref: '#/components/schemas/Address'}
        phoneNumber:
          type: string
          nullable: true
          description: Format `512-555-0101`. Null for customers registered before phone numbers existed.
          example: 512-555-0101
        dateOfBirth:
          type: string
          description: Format `MM/dd/yyyy`.
          pattern: '^\d{2}/\d{2}/\d{4}$'
          example: 03/15/1990
        dateOfBirthValid:
          type: boolean
          readOnly: true
          description: Derived - true when the birth year is 1940 or later.

    Account:
      type: object
      description: |
        A checking-or-savings account paired with its customer. Only the field pair that
        matches `accountType` is populated: for `CHECKING`, `checkingAccountNumber` and
        `checkingBalance` are set and the `saving*` pair is `null`; for `SAVINGS`, the reverse.
      properties:
        checkingAccountNumber: {type: string, nullable: true, example: CH-0000088291}
        savingAccountNumber: {type: string, nullable: true, example: null}
        checkingBalance: {type: number, nullable: true, example: 1500.00}
        savingBalance: {type: number, nullable: true, example: null}
        accountType: {$ref: '#/components/schemas/AccountType'}
        accountStatus: {$ref: '#/components/schemas/AccountStatus'}
        createdDate: {type: string, format: date, nullable: true}
        closedDate: {type: string, format: date, nullable: true}
        suspended: {type: boolean, description: 'True exactly while `accountStatus` is `SUSPENDED`.'}
        suspendedStart: {type: string, format: date-time, nullable: true, example: '2026-10-01T09:30:00'}
        suspendedEnd:
          type: string
          format: date-time
          nullable: true
          description: When the suspension lifts automatically; null = indefinite.
          example: '2026-10-15T17:00:00'
        suspensionNotes: {type: string, nullable: true, maxLength: 500, example: Fraud review}
        customer:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Customer'

    AccountStatusView:
      type: object
      description: Flattened per-account row; never includes balance.
      properties:
        accountNumber: {type: string, example: CH-0000088291}
        accountType: {$ref: '#/components/schemas/AccountType'}
        accountStatus: {$ref: '#/components/schemas/AccountStatus'}
        createdDate: {type: string, format: date}
        closedDate: {type: string, format: date, nullable: true}
        suspended: {type: boolean}
        suspendedStart: {type: string, format: date-time, nullable: true}
        suspendedEnd: {type: string, format: date-time, nullable: true, description: Null = indefinite.}
        suspensionNotes: {type: string, nullable: true}
        firstName: {type: string, example: Jane}
        lastName: {type: string, example: Doe}

    LocationType:
      type: string
      description: >-
        `OFFICE` is a staffed branch, `ATM` a stand-alone ATM, `BOTH` a branch with an ATM on site.
      enum: [OFFICE, ATM, BOTH]

    BankOperationServices:
      type: string
      description: >-
        An operation a location serves. `ATM_*` values apply to `ATM`/`BOTH` locations; the rest
        to `OFFICE`/`BOTH`.
      enum: [BANKING, SAFE_DEPOSIT_LOCKER, LOANS_MORTGAGES, NOTARY, WIRE_TRANSFER, FOREIGN_EXCHANGE, ATM_CASH_WITHDRAWAL, ATM_DEPOSIT]

    BankAddress:
      type: object
      properties:
        addressLine1: {type: string, example: 5085 Westheimer Rd}
        addressLine2: {type: string, nullable: true, example: Suite 100}
        city: {type: string, example: Houston}
        state: {type: string, example: TX}
        zip: {type: string, example: '77056'}
        country: {type: string, default: USA, example: USA}

    BankLocation:
      type: object
      properties:
        id: {type: integer, format: int64}
        name: {type: string, example: Houston Galleria Branch}
        bankAddress: {$ref: '#/components/schemas/BankAddress'}
        locationType: {$ref: '#/components/schemas/LocationType'}
        opensAt:
          type: string
          format: time
          nullable: true
          description: Office opening time (`HH:mm:ss`, wall clock in `timeZone`). Null for `ATM`.
          example: '08:00:00'
        closesAt:
          type: string
          format: time
          nullable: true
          description: Office closing time. Null for `ATM`.
          example: '16:00:00'
        timeZone:
          type: string
          description: IANA zone id for the hours; `America/Chicago` is Central time and follows daylight saving.
          example: America/Chicago
        phoneNumber:
          type: string
          nullable: true
          description: Office phone. Null for `ATM`.
          example: (713) 555-0103
        services:
          type: array
          description: Operations served, in enum order.
          items: {$ref: '#/components/schemas/BankOperationServices'}

    SortInfo:
      type: object
      properties:
        empty: {type: boolean}
        sorted: {type: boolean}
        unsorted: {type: boolean}

    PageableInfo:
      type: object
      properties:
        pageNumber: {type: integer}
        pageSize: {type: integer}
        sort: {$ref: '#/components/schemas/SortInfo'}
        offset: {type: integer, format: int64}
        paged: {type: boolean}
        unpaged: {type: boolean}

    AccountStatusViewPage:
      type: object
      description: Standard Spring Data `Page` serialization.
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/AccountStatusView'}
        pageable: {$ref: '#/components/schemas/PageableInfo'}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
        last: {type: boolean}
        first: {type: boolean}
        size: {type: integer}
        number: {type: integer, description: Zero-based page index.}
        sort: {$ref: '#/components/schemas/SortInfo'}
        numberOfElements: {type: integer}
        empty: {type: boolean}

    BankLocationPage:
      type: object
      description: Standard Spring Data `Page` serialization.
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/BankLocation'}
        pageable: {$ref: '#/components/schemas/PageableInfo'}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
        last: {type: boolean}
        first: {type: boolean}
        size: {type: integer}
        number: {type: integer, description: Zero-based page index.}
        sort: {$ref: '#/components/schemas/SortInfo'}
        numberOfElements: {type: integer}
        empty: {type: boolean}

    AccountLookupRequest:
      type: object
      required: [accountNumber]
      properties:
        accountNumber:
          type: string
          minLength: 1
          description: Must not be blank.
          example: CH-0000088291

    AccountRegistrationRequest:
      type: object
      required: [firstName, lastName, dateOfBirth, phoneNumber, street, city, state, zip, addressLine1, accountType]
      properties:
        firstName: {type: string, minLength: 1, maxLength: 50, example: Jane}
        lastName: {type: string, minLength: 1, maxLength: 50, example: Doe}
        dateOfBirth:
          type: string
          description: >-
            Format `MM/dd/yyyy`. Birth year must be 1940 or later, and the customer must be at
            least the configured minimum age (default 18).
          pattern: '^\d{2}/\d{2}/\d{4}$'
          example: 03/15/1990
        phoneNumber:
          type: string
          description: Exactly `###-###-####` (digits and hyphens).
          pattern: '^\d{3}-\d{3}-\d{4}$'
          example: 512-555-0101
        street: {type: string, minLength: 1, example: '111'}
        city: {type: string, minLength: 1, example: Leander}
        state:
          type: string
          description: Two uppercase letters.
          pattern: '^[A-Z]{2}$'
          example: TX
        zip:
          type: string
          description: Exactly five digits.
          pattern: '^\d{5}$'
          example: '78717'
        addressLine1: {type: string, minLength: 1, maxLength: 50, example: Leafvillage}
        addressLine2: {type: string, nullable: true, example: Unit1}
        accountType:
          type: string
          description: >-
            Case-insensitive `checking` or `savings` (any case). Other `AccountType` names
            parse but are not supported; unknown values return `400`.
          example: checking

    WithdrawalRequest:
      type: object
      required: [accountNumber, accountType, withdrawAmount, street, city, state, zip]
      properties:
        accountNumber:
          type: string
          description: Must start with `CH` or `SV` (case-insensitive).
          example: CH-0000088291
        accountType:
          $ref: '#/components/schemas/AccountType'
        withdrawAmount:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: Amount to withdraw, up to two decimals.
          example: 100.75
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[a-zA-Z]+$'
          description: Letters only. The withdrawal-history entry stores it.
          example: Jane
        lastName:
          type: string
          minLength: 1
          maxLength: 25
          pattern: '^[a-zA-Z]+$'
          description: Letters only.
          example: Doe
        street: {type: string, minLength: 1, example: '111'}
        city: {type: string, minLength: 1, example: Leander}
        state:
          type: string
          pattern: '^[A-Z]{2}$'
          description: Two uppercase letters.
          example: TX
        zip: {type: string, minLength: 1, example: '78717'}
        addressLine1: {type: string, nullable: true}
        addressLine2: {type: string, nullable: true}
        withdrawalDate:
          type: string
          format: date-time
          description: Accepted but ignored - the server uses today's date.
        withdrawalStatus:
          type: string
          description: Accepted but ignored - the server records `COMPLETED`.

    DepositForm:
      type: object
      required: [accountNumber, accountType, amount, depositType, street, addressLine1, city, state, zip]
      properties:
        accountNumber:
          type: string
          description: Must start with `CH` or `SV` (case-insensitive).
          example: SV-0000044102
        accountType:
          $ref: '#/components/schemas/AccountType'
        amount:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: Amount to deposit. Cash deposits are capped (default 5000.00).
          example: 250.00
        depositType:
          type: string
          enum: [cash, check]
          description: Case-insensitive.
          example: check
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[a-zA-Z]+$'
          example: Jane
        lastName:
          type: string
          minLength: 1
          maxLength: 25
          pattern: '^[a-zA-Z]+$'
          example: Doe
        street: {type: string, minLength: 1, example: '111'}
        addressLine1:
          type: string
          minLength: 1
          maxLength: 50
          example: Leafvillage
        addressLine2:
          type: string
          maxLength: 50
          nullable: true
          pattern: '^[a-zA-Z0-9 ._-]+$'
        city:
          type: string
          minLength: 1
          maxLength: 50
          example: Leander
        state:
          type: string
          pattern: '^[A-Z]{2}$'
          example: TX
        zip:
          type: string
          pattern: '^\d{5}$'
          example: '78717'

    BulkCloseAccountsRequest:
      type: object
      required: [accountNumbers]
      properties:
        accountNumbers:
          type: array
          minItems: 1
          items: {type: string}
          example: [CH-0000088291, SV-0000044102]

    BulkCloseFailure:
      type: object
      properties:
        accountNumber: {type: string}
        reason:
          type: string
          description: Why this account was skipped (not found, or already closed).

    BulkCloseAccountsResult:
      type: object
      properties:
        closedAccounts:
          type: array
          items: {$ref: '#/components/schemas/Account'}
        failures:
          type: array
          items: {$ref: '#/components/schemas/BulkCloseFailure'}

    AccountTransaction:
      type: object
      properties:
        accountNumber: {type: string}
        transactionType: {$ref: '#/components/schemas/TransactionType'}
        amount: {type: number}
        balanceAfter: {type: number}
        transactionDate: {type: string, format: date}
        depositType:
          type: string
          nullable: true
          description: '`cash` or `check`; only set for deposits, `null` for withdrawals.'
        employeeNumber: {type: string, nullable: true, description: Employee who handled it; null for customer-initiated transactions and rows recorded before this was tracked., example: EMP-000010}
        employeeName: {type: string, nullable: true, example: Lucas Meyer}
        employeeRole: {allOf: [{$ref: '#/components/schemas/EmployeeRole'}], nullable: true}
        bankLocationId: {type: integer, format: int64, nullable: true, description: Branch office or ATM where it was handled (snapshot at transaction time).}
        bankLocationName: {type: string, nullable: true, example: Austin Downtown Branch}
        bankLocationType: {allOf: [{$ref: '#/components/schemas/LocationType'}], nullable: true}
        bankLocationCity: {type: string, nullable: true}
        bankLocationState: {type: string, nullable: true}

    BankStatement:
      type: object
      properties:
        accountNumber: {type: string}
        beginDate: {type: string, format: date}
        endDate: {type: string, format: date}
        transactions:
          type: array
          items: {$ref: '#/components/schemas/AccountTransaction'}

    PortalAccountSummary:
      type: object
      description: Account row on the portal home screen (no balance, no suspension notes).
      properties:
        accountNumber: {type: string, example: CH-0000088291}
        accountType: {$ref: '#/components/schemas/AccountType'}
        accountStatus: {$ref: '#/components/schemas/AccountStatus'}
        suspended: {type: boolean}
        suspendedUntil: {type: string, format: date-time, nullable: true, description: Null for an indefinite suspension.}
        createdDate: {type: string, format: date}
        closedDate: {type: string, format: date, nullable: true}
        firstName: {type: string}
        lastName: {type: string}
    PortalLocation:
      type: object
      description: Flattened branch/ATM card. Hours and phone are null for ATMs.
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        locationType: {$ref: '#/components/schemas/LocationType'}
        addressLine1: {type: string}
        city: {type: string}
        state: {type: string}
        zip: {type: string}
        opensAt: {type: string, format: time, nullable: true, example: '08:00:00'}
        closesAt: {type: string, format: time, nullable: true, example: '16:00:00'}
        timeZone: {type: string, example: America/Chicago}
        phoneNumber: {type: string, nullable: true}
        services:
          type: array
          items: {$ref: '#/components/schemas/BankOperationServices'}
    PortalActivityItem:
      type: object
      properties:
        transactionType: {$ref: '#/components/schemas/TransactionType'}
        amount: {type: number}
        balanceAfter: {type: number}
        transactionDate: {type: string, format: date}
        depositType: {type: string, nullable: true, description: '`cash` or `check`; null for withdrawals.'}
    AccountOverviewResponse:
      type: object
      properties:
        accountNumber: {type: string, example: CH-0000088291}
        accountType: {$ref: '#/components/schemas/AccountType'}
        accountStatus: {$ref: '#/components/schemas/AccountStatus'}
        balance: {type: number}
        suspended: {type: boolean, description: While true the account can't transact.}
        suspendedUntil: {type: string, format: date-time, nullable: true, description: Null for an indefinite suspension.}
        createdDate: {type: string, format: date}
        closedDate: {type: string, format: date, nullable: true}
        firstName: {type: string, nullable: true}
        lastName: {type: string, nullable: true}
        maskedPhoneNumber:
          type: string
          nullable: true
          description: Only the last four digits are shown (`***-***-0101`); null if no phone is on file. The BFF never returns the full number.
          example: '***-***-0101'
        activityDays: {type: integer, description: Window actually applied.}
        recentActivity:
          type: array
          items: {$ref: '#/components/schemas/PortalActivityItem'}
    PortalHomeResponse:
      type: object
      properties:
        totalActiveAccounts: {type: integer, format: int64}
        totalSuspendedAccounts: {type: integer, format: int64}
        accounts:
          type: array
          items: {$ref: '#/components/schemas/PortalAccountSummary'}
        nearbyLocations:
          type: array
          items: {$ref: '#/components/schemas/PortalLocation'}
    OpenAccountResponse:
      type: object
      properties:
        account: {$ref: '#/components/schemas/AccountOverviewResponse'}
        nearbyLocations:
          type: array
          items: {$ref: '#/components/schemas/PortalLocation'}
    SuspendAccountRequest:
      type: object
      required: [notes]
      properties:
        notes:
          type: string
          maxLength: 500
          description: Why the account is being suspended.
        startDateTime:
          type: string
          format: date-time
          description: ISO local date-time. Defaults to now; must not be in the future.
          example: '2026-10-01T09:30:00'
        endDateTime:
          type: string
          format: date-time
          description: ISO local date-time. Omit for an indefinite suspension; must be after the start and in the future.
          example: '2026-12-31T17:00:00'
    UpdateSuspensionRequest:
      type: object
      description: Partial update; provide at least one property.
      properties:
        notes: {type: string, maxLength: 500}
        endDateTime:
          type: string
          format: date-time
          description: Must be in the future and after the stored suspension start.
    SpringErrorResponse:
      type: object
      description: >-
        Spring Boot's default error body, returned when request validation fails or a
        parameter can't be parsed. It carries no field-level detail by default.
      properties:
        timestamp: {type: string, format: date-time}
        status: {type: integer, example: 400}
        error: {type: string, example: Bad Request}
        path: {type: string, example: /brite/v1/api/accounts/newaccount}
