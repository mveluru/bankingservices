openapi: 3.0.3

info:
  title: Brite Banking API
  version: 1.0.0
  description: |
    REST API for the `org.brite.banking` module of the bankingservices Spring Boot application:
    account registration, lookup, deposit/withdrawal, closing (single and bulk), paginated
    account-status search, bank office/ATM location search, bank statements, plus the module's async-notification and
    Resilience4j payment demo endpoints.

    ## Gateway behavior (applies to every endpoint in this document)

    Every path below sits behind two servlet filters (`org.brite.banking.gateway`), which run
    *before* the controllers:

    1. **`BusinessTransactionIdFilter`** generates a UUID per request and returns it in the
       `X-BTID` response header. The same id is stamped on every server log line for that
       request, so quote it when reporting a problem.
    2. **`BankingRateLimitFilter`** requires the customer-id header (default `X-Customer-Id`,
       configurable via `banking.rate-limit.customer-header-name`) and caps each customer at
       `banking.rate-limit.requests-per-day` requests/day (default 1000). A missing/blank
       header is rejected with `400`; an exhausted quota with `429`. Both are **plain-text**
       bodies written by the filter itself, not the JSON/text bodies produced by the
       controllers' exception handler. Every non-rejected response carries
       `X-RateLimit-Limit` and `X-RateLimit-Remaining`.

    `X-Customer-Id` identifies the caller for rate limiting only. It is **not**
    authentication - the API has no auth layer.

    ## Error bodies

    Business-rule failures (`BankingExceptionHandler`) return a bare `text/plain` message.
    Bean-validation failures on request bodies (`@Valid`) and malformed parameters are not
    handled by that advice and fall through to Spring Boot's default JSON error body
    (`SpringErrorResponse`).

    ## Persistence

    Accounts, customers, transactions and withdrawal history are stored in MySQL via JPA.
    Concurrent writes to one account are guarded by optimistic locking, so a losing
    concurrent writer surfaces as a `500`.
  contact:
    name: Brite Solutions
    email: britesupport@britesolutions.org

servers:
  - url: http://localhost:8081/brite
    description: Local development (port 8081, context path /brite)

tags:
  - name: Accounts
    description: Account registration, lookup, transactions, closing, search and statements. Everything except registration (`POST /newaccount`) needs the customer token, and only reaches the caller's own accounts. Customers can't suspend or reactivate accounts, which is staff-only work (tag `Staff`).
  - name: Locations
    description: Bank offices and ATMs.
  - name: Staff
    description: Employee-facing endpoints. Every call except the login needs a bearer token in the `Authorization` header (the employee JWT from `POST /v1/api/staff/login`); the token's employee must be ACTIVE with an ACTIVE login and hold the privilege for the action, which is re-checked on every call. Privileges come from the role (`TELLER` < `MANAGER` < `AREA_MANAGER`).
  - name: Login
    description: Verify an employee or customer username and 8-digit password. Returns a signed JWT access token and who the caller is. The employee token is required by every other staff endpoint.
  - name: Password reset
    description: Reset a forgotten password by answering three security questions (employees and customers), set those questions while logged in, and administrator password set.
  - name: Portal (BFF)
    description: Screen-shaped endpoints for the banking UI portal; compose the account and location services in one call. Everything except `POST accounts/open` needs the customer token, and only reaches the caller's own accounts. There is no suspend or reactivate here, which is staff-only work.
  - name: Clients
    description: Sample client record.
  - name: Payments
    description: Resilience4j circuit-breaker + retry demo.
  - name: Notifications
    description: '`@Async` email/SMS/report demos.'

security:
  - CustomerId: []

paths:
  /v1/api/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      security:
        - CustomerId: []
          CustomerBearerAuth: []
      summary: Search accounts (paginated)
      description: |
        Returns account status rows filtered by any combination of the optional filters,
        paginated and sorted with real SQL (Spring Data `Specification`). Results are cached
        for 10 minutes; the cache is evicted whenever an account is registered or closed.

        **Single vs. all accounts:** `accountNumber` is just another AND'd filter
        (case-insensitive equality). Supplying it returns at most that one account, and it is
        still subject to the other filters/date window - there is no separate
        get-one-account endpoint.

        **Default lookback:** if neither `createdFrom` nor `createdTo` is given, the created
        date range defaults to `[today - months, today]` (`months` defaults to 18). Supplying
        either explicit created-date bound disables that default and `months` is ignored.
        Older accounts (e.g. the seeded closed ones) need `months=36` or an explicit
        `createdFrom` to appear.

        Balances are deliberately not exposed by this view.
      parameters:
        - name: accountNumber
          in: query
          required: false
          description: Restrict to one account (case-insensitive exact match).
          schema: {type: string}
          example: CH-0000088291
        - name: status
          in: query
          required: false
          schema: {$ref: '#/components/schemas/AccountStatus'}
        - name: createdFrom
          in: query
          required: false
          description: Inclusive lower bound on `createdDate`. Must not be after `createdTo`.
          schema: {type: string, format: date}
        - name: createdTo
          in: query
          required: false
          description: Inclusive upper bound on `createdDate`.
          schema: {type: string, format: date}
        - name: closedFrom
          in: query
          required: false
          description: Inclusive lower bound on `closedDate`. Must not be after `closedTo`.
          schema: {type: string, format: date}
        - name: closedTo
          in: query
          required: false
          description: Inclusive upper bound on `closedDate`.
          schema: {type: string, format: date}
        - name: months
          in: query
          required: false
          description: >-
            Lookback window in months for the default created-date range. Ignored when
            `createdFrom` or `createdTo` is supplied. Must be positive (validated even when
            ignored).
          schema: {type: integer, format: int32, minimum: 1, default: 18}
        - name: page
          in: query
          required: false
          description: Zero-based page index.
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          required: false
          description: Page size.
          schema: {type: integer, minimum: 1, default: 20}
        - name: sort
          in: query
          required: false
          description: >-
            `property[,asc|desc]`; repeat the parameter for multiple sort keys. Allowed
            properties: `createdDate`, `closedDate`, `accountStatus`, `accountNumber`.
            Anything else returns `400`.
          style: form
          explode: true
          schema:
            type: array
            items: {type: string}
            default: [createdDate]
          example: ['createdDate,desc']
      responses:
        '200':
          description: One page of matching accounts (empty `content` if none match).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountStatusViewPage'}
              example:
                content:
                  - accountNumber: CH-0000088291
                    accountType: CHECKING
                    accountStatus: ACTIVE
                    createdDate: '2026-06-24'
                    closedDate: null
                    firstName: Jane
                    lastName: Doe
                pageable:
                  pageNumber: 0
                  pageSize: 20
                  sort: {empty: false, sorted: true, unsorted: false}
                  offset: 0
                  paged: true
                  unpaged: false
                totalElements: 1
                totalPages: 1
                last: true
                first: true
                size: 20
                number: 0
                sort: {empty: false, sorted: true, unsorted: false}
                numberOfElements: 1
                empty: false
        '400':
          $ref: '#/components/responses/BadRequestText'
        '401':
          $ref: '#/components/responses/CustomerUnauthorized'
        '403':
          $ref: '#/components/responses/CustomerForbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/api/accounts/lookup:
    post:
      tags: [Accounts]
      operationId: lookupAccount
      security:
        - CustomerId: []
          CustomerBearerAuth: []
      summary: Look up an account and its customer profile
      description: Returns the full `Account` (including balance and customer) for an account number.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountLookupRequest'}
            example: {accountNumber: CH-0000088291}
      responses:
        '200':
          description: Account found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '401':
          $ref: '#/components/responses/CustomerUnauthorized'
        '403':
          $ref: '#/components/responses/CustomerForbidden'
        '404':
          description: No account with that number. Plain-text body.
          content:
            text/plain:
              schema: {type: string}
              example: Account number not found in our records.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/api/accounts/newaccount:
    post:
      tags: [Accounts]
      operationId: registerAccount
      summary: Register a new customer and account
      description: |
        Creates a customer and a new checking **or** savings account. The account number is
        generated server-side as `CH-` (checking) or `SV-` (savings) followed by a
        zero-padded 10-digit number. New accounts start `ACTIVE` with `createdDate` = today.

        `phoneNumber` is required and must be `###-###-####`. Rules beyond field validation: the customer must be at least
        `banking.constraints.minimum-age` (default 18) years old and born in 1940 or later.
        Triggers an async email and SMS notification and evicts the account-search cache.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountRegistrationRequest'}
            example:
              firstName: Jane
              lastName: Doe
              dateOfBirth: 03/15/1990
              phoneNumber: 512-555-0101
              street: '111'
              addressLine1: Leafvillage
              addressLine2: Unit1
              city: Leander
              state: TX
              zip: '78717'
              accountType: checking
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400':
          description: >-
            Validation failure (JSON body), or a business rule was violated - under-age
            customer, unrecognized `accountType` (plain-text body).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpringErrorResponse'}
            text/plain:
              schema: {type: string}
              example: Customer must be at least 18 years old to open an account
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/api/accounts/withdraw:
    post:
      tags: [Accounts]
      operationId: withdraw
      security:
        - CustomerId: []
          CustomerBearerAuth: []
      summary: Withdraw funds
      description: |
        Withdraws `withdrawAmount` from a checking or savings account. The account type is
        derived from the account-number prefix (`CH` -> `CHECKING`, `SV` -> `SAVINGS`) and
        `accountType` in the body **must match it**.

        Checks, in order: account exists; account is not `CLOSED`; sufficient funds; the
        remaining balance must stay at or above the minimum
        (`banking.constraints.checking-minimum-balance` 25.00 / `saving-minimum-balance` 100.00
        by default). A completed withdrawal is recorded in withdrawal history and the
        transaction ledger, and triggers an async email/SMS.

        `withdrawalDate` and `withdrawalStatus` are accepted but ignored - the server stamps
        today's date and `COMPLETED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WithdrawalRequest'}
            example:
              accountNumber: CH-0000088291
              accountType: CHECKING
              withdrawAmount: 100.75
              firstName: Jane
              lastName: Doe
              street: '111'
              addressLine1: Leafvillage
              city: Leander
              state: TX
              zip: '78717'
      responses:
        '200':
          description: Withdrawal completed; returns the account with its updated balance.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400':
          description: >-
            Validation failure (JSON), or a business rule failed (plain text): non-positive
            amount, unrecognized prefix, type/prefix mismatch, account closed or suspended,
            insufficient funds, or minimum balance would be violated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpringErrorResponse'}
            text/plain:
              schema: {type: string}
              examples:
                insufficientFunds:
                  value: Insufficient funds in account CH-0000088291
                minimumBalance:
                  value: 'Withdrawal declined: account CH-0000088291 must retain a minimum balance of 25.00'
                closed:
                  value: Account CH-0000010004 is closed and cannot be used for transactions
                suspended:
                  value: Account CH-0000050001 is suspended and cannot be used for transactions until it is reactivated
        '401':
          $ref: '#/components/responses/CustomerUnauthorized'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '403':
          $ref: '#/components/responses/CustomerForbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/api/accounts/deposit:
    post:
      tags: [Accounts]
      operationId: deposit
      security:
        - CustomerId: []
          CustomerBearerAuth: []
      summary: Deposit funds
      description: |
        Deposits `amount` into a checking or savings account. As with withdrawals, the
        account type comes from the account-number prefix and `accountType` must match it.

        `depositType` must be `cash` or `check` (case-insensitive). **Cash deposits are
        capped** at `banking.constraints.maximum-deposit-amount-by-cash` (default 5000.00);
        check deposits are not. A `CLOSED` or `SUSPENDED` account rejects deposits (`400`). Unlike withdrawals,
        deposits do not trigger a notification.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DepositForm'}
            example:
              accountNumber: SV-0000044102
              accountType: SAVINGS
              amount: 250.00
              depositType: check
              firstName: Jane
              lastName: Doe
              street: '111'
              addressLine1: Leafvillage
              city: Leander
              state: TX
              zip: '78717'
      responses:
        '200':
          description: Deposit completed; returns the account with its updated balance.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400':
          description: >-
            Validation failure (JSON), or a business rule failed (plain text): non-positive
            amount, unrecognized prefix, type/prefix mismatch, invalid deposit type, cash
            limit exceeded, or account closed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpringErrorResponse'}
            text/plain:
              schema: {type: string}
              examples:
                cashLimit:
                  value: Cash deposits cannot exceed 5000.00
                depositType:
                  value: Deposit type must be 'cash' or 'check'
        '401':
          $ref: '#/components/responses/CustomerUnauthorized'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '403':
          $ref: '#/components/responses/CustomerForbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/api/accounts/{accountNumber}/close:
    post:
      tags: [Accounts]
      operationId: closeAccount
      security:
        - CustomerId: []
          CustomerBearerAuth: []
      summary: Close one account
      description: >-
        Transitions an `ACTIVE` or `SUSPENDED` account to `CLOSED` and stamps `closedDate` with
        today (a suspension is cleared). There is no reopen operation. Evicts the account-search cache.
      parameters:
        - $ref: '#/components/parameters/AccountNumberPath'
      responses:
        '200':
          description: 'Account closed; returns it with `accountStatus: CLOSED`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400':
          description: Account is already closed. Plain-text body.
          content:
            text/plain:
              schema: {type: string}
              example: Account CH-0000010004 is already closed
        '401':
          $ref: '#/components/responses/CustomerUnauthorized'
        '403':
          $ref: '#/components/responses/CustomerForbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/api/accounts/close:
    post:
      tags: [Accounts]
      operationId: closeAccounts
      security:
        - CustomerId: []
          CustomerBearerAuth: []
      summary: Bulk-close accounts (best effort)
      description: |
        Closes many accounts in one call. **Best effort, not all-or-nothing:** an unknown or
        already-closed account does not stop the rest. The response is always `200` when the
        request itself is valid - inspect `closedAccounts` and `failures` for per-account
        outcomes. Evicts the account-search cache once for the whole batch.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BulkCloseAccountsRequest'}
            example:
              accountNumbers: [CH-0000088291, SV-0000020004, CH-9999999999]
      responses:
        '200':
          description: Batch processed (individual accounts may still have failed).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BulkCloseAccountsResult'}
              example:
                closedAccounts:
                  - checkingAccountNumber: CH-0000088291
                    savingAccountNumber: null
                    checkingBalance: 1500.00
                    savingBalance: null
                    accountType: CHECKING
                    accountStatus: CLOSED
                    createdDate: '2026-06-24'
                    closedDate: '2026-09-24'
                    customer: null
                failures:
                  - accountNumber: SV-0000020004
                    reason: Account SV-0000020004 is already closed
                  - accountNumber: CH-9999999999
                    reason: 'Account not found: CH-9999999999'
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '401':
          $ref: '#/components/responses/CustomerUnauthorized'
        '403':
          $ref: '#/components/responses/CustomerForbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/api/accounts/{accountNumber}/statement:
    get:
      tags: [Accounts]
      operationId: getStatement
      security:
        - CustomerId: []
          CustomerBearerAuth: []
      summary: Generate a bank statement
      description: |
        Returns the account's deposit/withdrawal transactions with `transactionDate` between
        `beginDate` and `endDate` (both inclusive). `endDate` may not precede `beginDate`,
        and the span may not exceed `banking.constraints.max-statement-range-months`
        (default 18). Triggers an async email/SMS notification.
      parameters:
        - $ref: '#/components/parameters/AccountNumberPath'
        - name: beginDate
          in: query
          required: true
          schema: {type: string, format: date}
        - name: endDate
          in: query
          required: true
          schema: {type: string, format: date}
      responses:
        '200':
          description: The statement.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BankStatement'}
              example:
                accountNumber: CH-0000088291
                beginDate: '2026-08-01'
                endDate: '2026-09-24'
                transactions:
                  - accountNumber: CH-0000088291
                    transactionType: WITHDRAWAL
                    amount: 100.75
                    balanceAfter: 1399.25
                    transactionDate: '2026-09-10'
                    depositType: null
        '400':
          description: >-
            Missing/malformed date parameter (JSON), end date before begin date, or range
            too long (plain text).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpringErrorResponse'}
            text/plain:
              schema: {type: string}
              examples:
                order:
                  value: End date cannot be before begin date
                range:
                  value: Statement date range cannot exceed 18 months
        '401':
          $ref: '#/components/responses/CustomerUnauthorized'
        '403':
          $ref: '#/components/responses/CustomerForbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/api/locations:
    get:
      tags: [Locations]
      operationId: listBankLocations
      summary: Search bank offices and ATMs (paginated)
      description: |
        Returns bank locations filtered by any combination of the optional filters, paginated
        and sorted with real SQL (Spring Data `Specification`). Not cached.

        **`type` matches by capability**, not by the stored value: `OFFICE` returns offices
        *and* office+ATM branches (`BOTH`), `ATM` returns ATMs *and* `BOTH` branches, and
        `BOTH` returns only branches that have both. `city`, `state` and `zip` are
        case-insensitive exact matches; `service` matches locations that serve that operation.

        Office hours (`opensAt`/`closesAt`) and `phoneNumber` belong to the office, so they are
        `null` for `ATM` locations.
      parameters:
        - name: type
          in: query
          required: false
          schema: {$ref: '#/components/schemas/LocationType'}
        - name: city
          in: query
          required: false
          schema: {type: string}
          example: Chicago
        - name: state
          in: query
          required: false
          description: Two-letter state code (case-insensitive).
          schema: {type: string}
          example: TX
        - name: zip
          in: query
          required: false
          schema: {type: string}
          example: '60603'
        - name: service
          in: query
          required: false
          schema: {$ref: '#/components/schemas/BankOperationServices'}
        - name: page
          in: query
          required: false
          description: Zero-based page index.
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          required: false
          description: Page size.
          schema: {type: integer, minimum: 1, default: 20}
        - name: sort
          in: query
          required: false
          description: >-
            `property[,asc|desc]`; repeat the parameter for multiple sort keys. Allowed
            properties: `name`, `locationType`, `city`, `state`. Anything else returns `400`.
          style: form
          explode: true
          schema:
            type: array
            items: {type: string}
            default: [name]
          example: ['city,asc']
      responses:
        '200':
          description: One page of matching locations (empty `content` if none match).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BankLocationPage'}
              example:
                content:
                  - id: 3
                    name: Houston Galleria Branch
                    bankAddress:
                      addressLine1: 5085 Westheimer Rd
                      addressLine2: null
                      city: Houston
                      state: TX
                      zip: '77056'
                      country: USA
                    locationType: BOTH
                    opensAt: '08:00:00'
                    closesAt: '16:00:00'
                    timeZone: America/Chicago
                    phoneNumber: (713) 555-0103
                    services: [BANKING, SAFE_DEPOSIT_LOCKER, FOREIGN_EXCHANGE, ATM_CASH_WITHDRAWAL, ATM_DEPOSIT]
                pageable:
                  pageNumber: 0
                  pageSize: 20
                  sort: {empty: false, sorted: true, unsorted: false}
                  offset: 0
                  paged: true
                  unpaged: false
                totalElements: 1
                totalPages: 1
                last: true
                first: true
                size: 20
                number: 0
                sort: {empty: false, sorted: true, unsorted: false}
                numberOfElements: 1
                empty: false
        '400':
          $ref: '#/components/responses/BadRequestText'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/api/locations/{id}:
    get:
      tags: [Locations]
      operationId: getBankLocation
      summary: Get one bank location by id
      description: |
        Returns a single office/ATM. Ids are the `id` values returned by the location search.
        A non-numeric id is rejected with Spring Boot's default JSON error (`400`).
      parameters:
        - $ref: '#/components/parameters/LocationIdPath'
      responses:
        '200':
          description: The location.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BankLocation'}
              example:
                id: 4
                name: San Antonio Riverwalk ATM
                bankAddress:
                  addressLine1: 100 E Commerce St
                  addressLine2: null
                  city: San Antonio
                  state: TX
                  zip: '78205'
                  country: USA
                locationType: ATM
                opensAt: null
                closesAt: null
                timeZone: America/Chicago
                phoneNumber: null
                services: [ATM_CASH_WITHDRAWAL, ATM_DEPOSIT]
        '400':
          $ref: '#/components/responses/BadRequestJson'
        '404':
          $ref: '#/components/responses/LocationNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/api/staff/accounts/withdraw:
    post:
      tags: [Staff]
      operationId: staffWithdraw
      summary: Withdraw as an employee
      description: |
        Requires the `WITHDRAW` privilege. On success it delegates to the same rule set as the matching customer endpoint, so its business errors apply too.
      security:
        - CustomerId: []
          BearerAuth: []
      parameters:
        - name: locationId
          in: query
          required: false
          description: Branch office or ATM where this is handled; defaults to the employee's own branch (none for an area manager). `404` if unknown. The employee and this location are recorded on the transaction.
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WithdrawalRequest'}
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400':
          description: A failed validation (JSON) or a business rule (plain text).
          content:
            text/plain:
              schema: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmployeeForbidden'
        '404':
          description: The token's employee no longer exists, or unknown account. Plain-text body.
          content:
            text/plain:
              schema: {type: string}
        '429':
