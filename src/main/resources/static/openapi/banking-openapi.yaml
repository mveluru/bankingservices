  /v1/api/staff/login:
    post:
      tags: [Login]
      operationId: staffLogin
      summary: Employee login
      description: |
        Verifies the username (case-insensitive) and 8-digit password and returns a signed **JWT access token**
        (HS256, 30 minutes by default, no refresh token) plus who the caller is. **Every other staff endpoint requires
        this token** as `Authorization: Bearer <token>`; the endpoint verifies the signature and expiry and takes the
        acting employee from the token's `sub`. Responses are `Cache-Control: no-store`. The token carries `iss`, `sub`
        (employee number / customer id), `type` (`employee`/`customer`), `role` (employees), `jti`, `iat`, `exp`;
        no personal data.
        Unknown username and wrong password give the same `401`. After 5 wrong passwords the login is `LOCKED` for
        15 minutes (`423`); while locked, even the right password is refused. A right password on an `INACTIVE` or
        `SUSPENDED` login is `403` (or the employee isn't `ACTIVE` - on leave or terminated). The password is never logged or returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            example:
              username: lucas.meyer
              password: '20260010'
      responses:
        '200':
          description: Credentials verified; token issued.
          headers:
            Cache-Control:
              schema: {type: string, example: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffLoginResponse'}
        '400':
          description: Missing `username` or `password` (Spring Boot default JSON error).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpringErrorResponse'}
        '401':
          description: Unknown username or wrong password. Plain text.
          content:
            text/plain:
              schema: {type: string}
              example: Invalid username or password
        '403':
          description: Right password but the login is `INACTIVE`/`SUSPENDED` (or the employee isn't `ACTIVE` - on leave or terminated). Plain text.
          content:
            text/plain:
              schema: {type: string}
        '423':
          description: The login is `LOCKED`. Plain text.
          content:
            text/plain:
              schema: {type: string}
              example: 'Too many failed login attempts; locked until 2026-10-01T09:15:00'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/api/customers/login:
    post:
      tags: [Login]
      operationId: customerLogin
      summary: Customer login
      description: |
        Verifies the username (case-insensitive) and 8-digit password and returns a signed **JWT access token**
        (HS256, 30 minutes by default, no refresh token) plus who the caller is. **Every customer account and
        portal endpoint requires this token** (`/v1/api/accounts/**` and `/bff/v1/portal/**`, except the two that create a
        customer), and a customer can only reach their own accounts; it is refused on staff endpoints (`403`). A customer
        needs a login first: a manager creates it with `POST /v1/api/staff/customers/{customerId}/login`. Responses are `Cache-Control: no-store`. The token carries `iss`, `sub`
        (employee number / customer id), `type` (`employee`/`customer`), `role` (employees), `jti`, `iat`, `exp`;
        no personal data.
        Unknown username and wrong password give the same `401`. After 5 wrong passwords the login is `LOCKED` for
        15 minutes (`423`); while locked, even the right password is refused. A right password on an `INACTIVE` or
        `SUSPENDED` login is `403`. The password is never logged or returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            example:
              username: customer0005
              password: '20260005'
      responses:
        '200':
          description: Credentials verified; token issued.
          headers:
            Cache-Control:
              schema: {type: string, example: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerLoginResponse'}
        '400':
          description: Missing `username` or `password` (Spring Boot default JSON error).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpringErrorResponse'}
        '401':
          description: Unknown username or wrong password. Plain text.
          content:
            text/plain:
              schema: {type: string}
              example: Invalid username or password
        '403':
          description: Right password but the login is `INACTIVE`/`SUSPENDED`. Plain text.
          content:
            text/plain:
              schema: {type: string}
        '423':
          description: The login is `LOCKED`. Plain text.
          content:
            text/plain:
              schema: {type: string}
              example: 'Too many failed login attempts; locked until 2026-10-01T09:15:00'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/api/customers/password-reset/questions:
    post:
      tags: [Password reset]
      operationId: customerPasswordResetQuestions
      summary: The customer's security questions
      description: |
        Open endpoint (no token): the user can't log in. Returns the three questions this customer chose, in order, as code plus text. An unknown username, or a user who never chose questions, gets three **decoy** questions derived from the username, so the answer doesn't reveal whether the account exists.
      security:
        - CustomerId: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetQuestionsRequest'}
            example: {username: alice.smith}
      responses:
        '200':
          description: Three questions.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SecurityQuestionView'}}
        '400':
          description: Missing `username` (JSON validation).
          content:
            text/plain:
              schema: {type: string}
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/api/customers/password-reset:
    post:
      tags: [Password reset]
      operationId: customerPasswordReset
      summary: Reset a forgotten customer password
      description: |
        Open endpoint (no token). Send the username, the answers to the user's **three** questions and the new 8-digit password.
        Answers are compared case-insensitively with whitespace collapsed (`  Honda   Civic ` matches `honda civic`) and stored only as BCrypt hashes. Every answer must be right.
        Unknown user, no questions set and wrong answers all give the same `401`. Wrong answers are counted; after `banking.password-reset.max-failed-attempts` (3) the reset is locked for `lockout-minutes` (30) and returns `423` even for right answers.
        The login must be `ACTIVE` (an expired automatic lock counts as ACTIVE), so a reset never undoes an administrator's `INACTIVE`, `SUSPENDED` or `LOCKED` (`403`, only reported once the answers are right).
        On success the login and reset failure counters are cleared and **every token issued before now stops working** (`401`). The new password and the answers are masked in request logs.
      security:
        - CustomerId: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetRequest'}
            example: {username: alice.smith, newPassword: '24681357', answers: [{question: FIRST_CAR, answer: Honda Civic}, {question: FIRST_SCHOOL, answer: Oak Street}, {question: FIRST_TEACHER, answer: Mrs Patel}]}
      responses:
        '204':
          description: Password reset.
        '400':
          description: Wrong answer count (needs exactly 3), a blank or unknown question/answer (JSON validation), or a new password that isn't exactly 8 digits (plain text).
          content:
            text/plain:
              schema: {type: string}
        '401':
          description: Unknown user, no questions set, or wrong answers.
          content:
            text/plain:
              schema: {type: string}
              example: Invalid username or answers
        '403':
          description: The answers were right but the login is `INACTIVE`, `SUSPENDED` or `LOCKED`.
          content:
            text/plain:
              schema: {type: string}
        '423':
          description: Too many wrong answers; the reset is locked.
          content:
            text/plain:
              schema: {type: string}
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/api/customers/security-questions:
    put:
      tags: [Password reset]
      operationId: customerSetSecurityQuestions
      summary: Choose and answer three security questions
      description: |
        Requires the customer token. Pick **three different** questions from the catalog and answer each (2 to 100 characters). Replaces any earlier choice in place. Needs the **current password** so a stolen token alone can't change the questions that guard the password reset.
        Returns the chosen questions (never the answers). The answers and current password are masked in request logs.
      security:
        - CustomerId: []
          CustomerBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetSecurityQuestionsRequest'}
            example: {currentPassword: '20260009', answers: [{question: FIRST_CAR, answer: Honda Civic}, {question: FIRST_SCHOOL, answer: Oak Street}, {question: FIRST_TEACHER, answer: Mrs Patel}]}
      responses:
        '200':
          description: The chosen questions.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SecurityQuestionView'}}
        '400':
          description: Not exactly 3 answers, a duplicate question, or an answer outside 2-100 characters.
          content:
            text/plain:
              schema: {type: string}
        '401':
          $ref: '#/components/responses/CustomerUnauthorized'
        '423':
          description: The login is locked from wrong passwords.
          content:
            text/plain:
              schema: {type: string}
        '429':
          $ref: '#/components/responses/TooManyRequests'

